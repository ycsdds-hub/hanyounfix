name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: 확장 로직 테스트
        run: npm test
      - name: 앱 로직 테스트 (공통 사례, Mac 키 표 포함)
        run: python3 -m unittest discover -s app/tests -v
      - name: 확장 프로그램 zip 만들기
        run: cd extension && zip -r ../hanyoung-fix-extension.zip . -x '.*'
      - uses: actions/upload-artifact@v7
        with:
          name: hanyoung-fix-extension
          path: hanyoung-fix-extension.zip

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: python -m pip install -r app/requirements.txt pyinstaller==6.10.0
      - name: 로직 테스트
        run: python -m unittest discover -s app/tests -v
      - name: Windows 스모크 테스트
        run: python app/tests/smoke_windows.py
      - name: exe 빌드
        shell: cmd
        run: app\build.bat
      - name: exe 실행 확인 (5초)
        shell: pwsh
        run: |
          $p = Start-Process app\dist\HanYoungFix.exe -PassThru
          Start-Sleep 5
          if ($p.HasExited) { Get-Content "$env:APPDATA\HanYoungFix\log.txt" -ErrorAction SilentlyContinue; throw "exe가 바로 종료됨 (코드 $($p.ExitCode))" }
          Stop-Process $p
          Get-Content "$env:APPDATA\HanYoungFix\log.txt" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: HanYoungFix-windows
          path: app/dist/HanYoungFix.exe
      - name: 릴리스에 첨부 (v로 시작하는 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/dist/HanYoungFix.exe

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: python -m pip install -r app/requirements-mac.txt pyinstaller==6.10.0
      - name: 로직 테스트
        run: python -m unittest discover -s app/tests -v
      - name: macOS 스모크 테스트
        run: python app/tests/smoke_mac.py
      - name: .app 빌드
        run: bash app/build_mac.sh
      - name: 앱 실행 확인 (8초)
        run: |
          app/dist/HanYoungFix.app/Contents/MacOS/HanYoungFix &
          PID=$!
          sleep 8
          LOG="$HOME/Library/Application Support/HanYoungFix/log.txt"
          if ! kill -0 $PID 2>/dev/null; then cat "$LOG" 2>/dev/null || true; echo "앱이 바로 종료됨"; exit 1; fi
          kill $PID || true
          cat "$LOG" 2>/dev/null || true
          if grep -q "Traceback" "$LOG" 2>/dev/null; then echo "로그에 오류가 있음"; exit 1; fi
      - name: 실제 타이핑 확인 (한국어 두벌식, 테스트 창)
        timeout-minutes: 10
        run: |
          app/dist/HanYoungFix.app/Contents/MacOS/HanYoungFix &
          PID=$!
          sleep 5
          python -u app/tests/e2e_mac.py || RC=$?
          kill $PID || true
          cat "$HOME/Library/Application Support/HanYoungFix/log.txt" 2>/dev/null | tail -20 || true
          exit ${RC:-0}
      - uses: actions/upload-artifact@v7
        with:
          name: HanYoungFix-mac
          path: app/dist/HanYoungFix-mac.zip
      - name: 릴리스에 첨부 (v로 시작하는 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/dist/HanYoungFix-mac.zip
