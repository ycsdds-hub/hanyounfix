name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: 확장 로직 테스트
        run: npm test
      - name: Windows 앱 로직 테스트 (공통 사례 포함)
        run: python3 -m unittest discover -s windows/tests -v
      - name: 확장 프로그램 zip 만들기
        run: cd extension && zip -r ../hanyoung-fix-extension.zip . -x '.*'
      - uses: actions/upload-artifact@v7
        with:
          name: hanyoung-fix-extension
          path: hanyoung-fix-extension.zip

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: python -m pip install -r windows/requirements.txt pyinstaller==6.10.0
      - name: 로직 테스트
        run: python -m unittest discover -s windows/tests -v
      - name: Windows 스모크 테스트
        run: python windows/tests/smoke_windows.py
      - name: exe 빌드
        shell: cmd
        run: windows\build.bat
      - name: exe 실행 확인 (5초)
        shell: pwsh
        run: |
          $p = Start-Process windows\dist\HanYoungFix.exe -PassThru
          Start-Sleep 5
          if ($p.HasExited) { Get-Content "$env:APPDATA\HanYoungFix\log.txt" -ErrorAction SilentlyContinue; throw "exe가 바로 종료됨 (코드 $($p.ExitCode))" }
          Stop-Process $p
          Get-Content "$env:APPDATA\HanYoungFix\log.txt" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: HanYoungFix-windows
          path: windows/dist/HanYoungFix.exe
      - name: 릴리스에 첨부 (v로 시작하는 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: windows/dist/HanYoungFix.exe
